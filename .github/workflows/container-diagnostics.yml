name: Diagnose offline containers without publishing
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: container-diagnostics
  cancel-in-progress: false
jobs:
  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-production.txt
      - run: python -m pip install -r requirements-production.txt
      - run: python -m backend.deployment init
      - id: assets
        env:
          SIYAR_MODEL_PROFILE: arabic-retrieval-v1
        run: python scripts/asset_cache_key.py >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: deploy/artifacts
          key: arabic-complete-v3-${{ runner.os }}-${{ steps.assets.outputs.key }}
          fail-on-cache-miss: true
      - name: Build diagnostic images
        run: |
          docker build --platform linux/amd64 -f deploy/api.Dockerfile -t siyar-diagnostic-api:local .
          docker build --platform linux/amd64 -f deploy/web.Dockerfile -t siyar-diagnostic-web:local .
      - name: Exercise disposable offline containers with phase diagnostics
        run: python scripts/container_qa.py --api siyar-diagnostic-api:local --web siyar-diagnostic-web:local
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-diagnostics-${{ github.sha }}
          path: deploy/test-output/
          retention-days: 14
