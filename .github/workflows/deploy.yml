name: Verify, build and publish Coolify release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  packages: write
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-production.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install runtime and build-only dependencies
        run: |
          python -m pip install -r requirements-production.txt -r requirements.txt onnx==1.23.2 transformers==5.21.0
          python -m pip check
      - name: Restore verified current library without reimporting
        run: python -m backend.deployment init
      - name: Python source, API, auth, transport and preservation tests
        run: |
          mkdir -p deploy/test-output
          python -m pytest -q --junitxml=deploy/test-output/python-tests.xml
      - name: Frontend compile
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
          cd frontend
          npx playwright install --with-deps chromium
          npm run test:e2e -- production-auth.spec.ts
      - name: Cache versioned offline assets
        id: offline-cache
        uses: actions/cache/restore@v4
        with:
          path: deploy/artifacts
          key: portable-int8-v2-${{ runner.os }}-${{ hashFiles('backend/semantic*.py', 'backend/reading*.py', 'backend/diacritics.py', 'requirements-production.txt', 'deploy/seed/manifest.json') }}
      - name: Prepare both indexes outside VPS
        env:
          SIYAR_MODEL_DIR: ${{ github.workspace }}/deploy/artifacts/models
          SIYAR_CPU_THREADS: '2'
          SIYAR_ONNX_TOKENIZER: rust
        run: python -m backend.semantic prepare --runtime onnx-portable --directory deploy/artifacts/semantic --batch-size 8
      - name: Save completed assets before evaluation and container testing
        if: steps.offline-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: deploy/artifacts
          key: ${{ steps.offline-cache.outputs.cache-primary-key }}
      - name: Verify retrieval accuracy and offline operation
        env:
          SIYAR_MODEL_DIR: ${{ github.workspace }}/deploy/artifacts/models
          SIYAR_SEMANTIC_DIR: ${{ github.workspace }}/deploy/artifacts/semantic
          SIYAR_CPU_THREADS: '1'
          SIYAR_RERANK_BATCH: '1'
          SIYAR_ONNX_TOKENIZER: rust
        run: |
          python scripts/evaluate_semantic.py --require-hybrid --output deploy/test-output/semantic-evaluation.json
          python -m pytest tests/test_semantic_offline.py tests/test_onnx_lightweight.py -q
          python -m pytest tests/test_rust_tokenizer.py -q
      - name: Build AMD64 images locally on CI
        run: |
          docker build --platform linux/amd64 -f deploy/api.Dockerfile -t ghcr.io/m-jadallah/sear-alaam-anobalaa-api:sha-${{ github.sha }} .
          docker build --platform linux/amd64 -f deploy/web.Dockerfile -t ghcr.io/m-jadallah/sear-alaam-anobalaa-web:sha-${{ github.sha }} .
      - name: Exercise actual memory-limited offline containers
        run: python scripts/container_qa.py --api ghcr.io/m-jadallah/sear-alaam-anobalaa-api:sha-${{ github.sha }} --web ghcr.io/m-jadallah/sear-alaam-anobalaa-web:sha-${{ github.sha }}
      - name: Enforce the 80 percent retrieval release gate
        run: python -c "import json; d=json.load(open('deploy/test-output/semantic-evaluation.json')); assert d['goals']['descriptive_hit_at_10_at_least_80_percent'], d['descriptive_questions']"
      - name: Login to private GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested images and immutable deployment branch
        env:
          RELEASE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/publish_release.py
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-verification-${{ github.sha }}
          path: deploy/test-output/
          retention-days: 14
