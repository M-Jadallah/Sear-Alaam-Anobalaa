worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    client_max_body_size 32k;
    sendfile on;
    keepalive_timeout 30;
    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;
    resolver 127.0.0.11 valid=10s ipv6=off;
    limit_req_zone $binary_remote_addr zone=login:1m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=semantic:1m rate=12r/m;
    real_ip_header X-Forwarded-For;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_recursive on;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        set $api http://api:8000;
        location = /healthz { access_log off; default_type text/plain; return 200 'ok'; }
        location = /api/auth/login {
            limit_req zone=login burst=3 nodelay;
            limit_req_status 429;
            include /etc/nginx/proxy_params_siyar;
        }
        location = /api/search/smart {
            limit_req zone=semantic burst=3 nodelay;
            limit_req_status 429;
            include /etc/nginx/proxy_params_siyar;
        }
        location /api/ { include /etc/nginx/proxy_params_siyar; }
        location /assets/ { expires 1y; try_files $uri =404; }
        location / { try_files $uri $uri/ /index.html; expires -1; }
    }
}
